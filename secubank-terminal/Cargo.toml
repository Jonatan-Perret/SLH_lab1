[package]
name = "secubank-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
argon2 = "0.6.0"
base64 = "0.22"
cedar-policy = { version = "4.14.0", default-features = false }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
passwords = { version = "3.1.19", features = ["common-password"] }
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false, features = [
    "form",
    "json",
] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "time"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"
zxcvbn = "3.1.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Optimize Argon2 in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros"] }
